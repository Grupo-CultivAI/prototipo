# Confere cada PR antes do merge: lint, checagens das respostas do chat, cores pelos tokens,
# checagem de tipos, build e acessibilidade. Antes, quem descobria um build quebrado era a
# Vercel, já no deploy. Gratuito para repositórios públicos.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # O build carrega rotas que exigem estas variáveis ao iniciar. Os valores são falsos: o
    # MONGODB_URI aponta para o banco descartável abaixo, e nenhuma API externa é chamada.
    env:
      JWT_SECRET: valor-falso-somente-para-compilar
      MONGODB_URI: mongodb://localhost:27017/ci
      NEXT_TELEMETRY_DISABLED: 1
    # Banco vazio, só para a checagem de acessibilidade: ela cria uma conta de teste para
    # entrar nas telas logadas. Some quando o fluxo termina.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # Checagens das respostas do chat (agronomia, agrotóxicos, origem da informação, reescrita),
      # sem rede nem IA (tests/checagens.mjs)
      - name: Checagens das respostas do chat
        run: npm run checagens
      # Cor nova entra como token em src/styles/variables.css (docs/design-system.md)
      - name: Cores só pelos tokens
        run: npm run checar-tokens
      - name: Build
        run: npm run build
      # Depois do build: é ele que gera o next-env.d.ts (fora do git), com os tipos dos
      # arquivos .css. Antes dele, a checagem acusa "Cannot find module ...module.css".
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Navegador da checagem de acessibilidade
        run: npx playwright install --with-deps chromium
      # axe-core em todas as telas, no celular e no computador (tests/acessibilidade.mjs).
      # Reprova com problema grave ou crítico das regras WCAG 2.2 A/AA.
      - name: Acessibilidade
        run: |
          npm start > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          npm run acessibilidade
      - name: Log do servidor (se a acessibilidade falhar)
        if: failure()
        run: tail -n 100 servidor.log || true
