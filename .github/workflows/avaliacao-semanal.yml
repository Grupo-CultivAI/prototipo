# Avaliação das respostas da IA, toda segunda-feira às 3h de Brasília (pouco uso do chat), e a
# qualquer momento pela aba Actions ("Run workflow"). Faz as perguntas de tests/avaliar-respostas.mjs
# à IA de verdade, num banco descartável, e reprova se alguma resposta tiver erro agronômico
# conhecido, agrotóxico com dose ou não cumprir o que o caso espera. O resumo aparece na página
# da execução, e os resultados completos ficam como arquivo para baixar.
#
# Precisa das chaves como secrets do repositório (Settings → Secrets and variables → Actions):
# GROQ_API_KEY, PINECONE_API_KEY e PINECONE_INDEX_HOST; NVIDIA_API_KEY e OPENWEATHER_API_KEY são
# opcionais. Sem elas, o fluxo só avisa e termina sem falhar. Gasta ~10 perguntas da cota da IA.
name: Avaliação semanal das respostas

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: valor-falso-somente-para-a-avaliacao
      MONGODB_URI: mongodb://localhost:27017/cultivai
      NEXT_TELEMETRY_DISABLED: 1
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Conferir as chaves da IA
        id: chaves
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
        run: |
          if [ -n "$GROQ_API_KEY" ] && [ -n "$PINECONE_API_KEY" ] && [ -n "$PINECONE_INDEX_HOST" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Avaliação não rodou: faltam os secrets GROQ_API_KEY, PINECONE_API_KEY e PINECONE_INDEX_HOST."
          fi
      - uses: actions/checkout@v7
        if: steps.chaves.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.chaves.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.chaves.outputs.ok == 'true'
        run: npm ci
      - name: Build
        if: steps.chaves.outputs.ok == 'true'
        run: npm run build
      - name: Avaliar as respostas
        if: steps.chaves.outputs.ok == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_HOST: ${{ secrets.PINECONE_INDEX_HOST }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          npm start > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          npm run avaliar-respostas
      - name: Guardar os resultados
        if: always() && steps.chaves.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: avaliacao-respostas
          path: |
            ${{ runner.temp }}/avaliacao-respostas.json
            servidor.log
          if-no-files-found: ignore
